<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estilos en enlaces</title>

    <style>

        a {
            text-decoration: none;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 2em;
            padding: 10px;
            border-radius: 10px;
        }

        /* Enlace normal */
        a:link {
            background-color: blue;
            color: white;
        }

        /* Enlace visitado */
        a:visited {
            background-color: white;
            color: grey;
        }

        /* Cuando pasamos el ratón */
        a:hover {
            background-color: chartreuse;
            color: red;
        }

        /* Cuando pulsamos el enlace */
        a:active {
            font-weight: bold;
            color: orange;
            text-shadow: 3px 3px 5px black;
        }

    </style>

</head>

<body>

    <h1>Propiedades de enlaces</h1>

    <a href="https://www.iesjuanbosco.es">
        Contacto
    </a>

</body>
</html>
